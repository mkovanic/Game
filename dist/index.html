<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sviečky a kľúče · Candles and Keys</title>
<meta name="description" content="3D príbehová hra z Nežnej revolúcie na Slovensku 1988–1989 · A 3D story game about the Velvet Revolution in Slovakia." />
<style>:root {
  --ink: #f4efe6;
  --muted: #b9b2a6;
  --accent: #ffc94a;
  --red: #d7141a;
  --blue: #2a6ad1;
  --panel: rgba(12, 14, 20, 0.78);
  --line: rgba(255, 255, 255, 0.14);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; color: var(--ink); font-family: var(--sans); }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font: inherit; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
button:hover:not(:disabled) { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .35; cursor: default; }
button.primary { background: var(--accent); color: #1a1408; border-color: transparent; font-weight: 700; }
button.primary:hover { background: #ffd46e; }
kbd { display: inline-block; min-width: 1.6em; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); font: 600 .85em var(--sans); text-align: center; }

/* overlays */
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
#menu { background: radial-gradient(ellipse at 50% 70%, rgba(5,7,11,.15), rgba(5,7,11,.85) 70%); }
#pause { background: rgba(5,7,11,.7); backdrop-filter: blur(4px); }
#card { background: rgba(5,7,11,.82); backdrop-filter: blur(6px); }
.menu-inner { width: min(760px, 100%); text-align: center; margin: auto; }
.menu-inner.small { width: min(520px, 100%); display: flex; flex-direction: column; gap: 14px; background: var(--panel); padding: 28px; border-radius: 16px; border: 1px solid var(--line); }
.menu-inner h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(40px, 8vw, 76px); margin: 4px 0 2px; letter-spacing: .5px; text-shadow: 0 4px 30px rgba(255,170,60,.35); }
.menu-inner h3 { margin: 26px 0 10px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); font-size: 15px; letter-spacing: .4px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; align-items: center; }
.settings span { color: var(--muted); font-size: 14px; }
.toggle { padding: 6px 12px; font-size: 14px; }
.toggle.on { background: rgba(255,201,74,.18); border-color: var(--accent); color: var(--accent); }
.chapters { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.chap { text-align: left; display: flex; flex-direction: column; gap: 2px; font-size: 14px; padding: 10px 12px; }
.chap b { font-size: 11px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
.chap small { color: var(--muted); font-size: 11px; }
.controls { margin-top: 22px; font-size: 13px; color: var(--muted); line-height: 1.8; }
.controls b { color: var(--ink); font-weight: 600; }
.disclaimer { margin-top: 10px; font-size: 12px; color: #8d877d; font-style: italic; }
.voices { margin-top: 14px; font-size: 12px; color: var(--muted); }
.warn { margin: 10px auto 0; max-width: 620px; font-size: 13px; line-height: 1.5; background: rgba(215,20,26,.14); border: 1px solid rgba(215,20,26,.4); padding: 10px 14px; border-radius: 10px; text-align: left; }
.logo { height: 60px; position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 22px; }
.logo .candle { width: 14px; height: 40px; background: linear-gradient(#f5ecd6, #d8ccb0); border-radius: 3px; position: relative; }
.logo .candle::before { content: ""; position: absolute; left: 50%; top: -22px; width: 14px; height: 22px; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 70%, #fff6c8, #ffb03a 45%, rgba(255,120,20,0) 70%); border-radius: 50% 50% 45% 45%; animation: flicker 1.4s infinite alternate; filter: blur(.3px); box-shadow: 0 0 30px 10px rgba(255,170,60,.35); }
.logo .keys { font-size: 34px; filter: grayscale(.3); animation: jingle 2.5s infinite; display: inline-block; }
@keyframes flicker { 0% { transform: translateX(-50%) scale(1, 1); } 50% { transform: translateX(-52%) scale(.93, 1.08); } 100% { transform: translateX(-48%) scale(1.04, .95); } }
@keyframes jingle { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-14deg); } 88% { transform: rotate(12deg); } 92% { transform: rotate(-8deg); } 96% { transform: rotate(5deg); } }

/* karta kapitoly */
.card-inner { width: min(720px, 100%); margin: auto; animation: rise .8s ease both; }
.card-inner .kicker { color: var(--accent); letter-spacing: 3px; text-transform: uppercase; font-size: 13px; font-weight: 600; }
.card-inner h1 { font-family: var(--serif); font-size: clamp(34px, 6vw, 58px); font-weight: 600; margin: 8px 0 6px; }
.card-inner .sub { margin-bottom: 22px; }
.card-inner .body p { font-family: var(--serif); font-size: clamp(17px, 2.2vw, 21px); line-height: 1.6; color: #e9e2d6; margin: 0 0 14px; }
.card-inner .credits { font-size: 12px; color: var(--muted); margin: 18px 0; }
.card-inner button { margin-top: 18px; padding: 12px 28px; font-size: 16px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#chapterTag { position: absolute; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 3px; text-shadow: 0 1px 6px #000; max-width: 60vw; }
#chapterTag span { font-family: var(--serif); font-size: 20px; font-weight: 600; }
#chapterTag small { color: var(--muted); font-size: 13px; }
#objective { position: absolute; top: 72px; left: 16px; max-width: min(420px, 70vw); font-size: 14px; line-height: 1.45; background: var(--panel); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 8px 8px 0; }
#objective b { color: var(--accent); }
#stats { position: absolute; top: 16px; right: 16px; font-size: 12px; color: var(--muted); background: var(--panel); padding: 6px 10px; border-radius: 8px; }
#stats i { font-style: normal; color: var(--accent); letter-spacing: 1px; }
#crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.6); box-shadow: 0 0 4px #000; }
#prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); background: var(--panel); padding: 10px 16px; border-radius: 999px; font-size: 15px; pointer-events: auto; cursor: pointer; border: 1px solid var(--line); white-space: nowrap; }
#prompt b { color: var(--accent); }
#lookHint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); font-size: 13px; color: var(--muted); background: var(--panel); padding: 6px 12px; border-radius: 8px; }
#toast { position: absolute; right: 16px; top: 56px; font-weight: 700; color: var(--accent); opacity: 0; text-shadow: 0 1px 6px #000; }
#toast.show { animation: toast 2.4s ease; }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* dialóg */
#dialogue { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(860px, calc(100vw - 32px)); background: linear-gradient(180deg, rgba(14,16,22,.88), rgba(8,9,13,.94)); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); cursor: pointer; animation: dlgIn .3s ease both; }
@keyframes dlgIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
#speaker { font-weight: 700; color: var(--accent); font-size: 15px; letter-spacing: .6px; margin-bottom: 6px; text-transform: uppercase; }
#speaker.me { color: #8fc1ff; }
#speaker.narr { color: var(--muted); font-style: italic; text-transform: none; }
#line { font-family: var(--serif); font-size: clamp(17px, 2.1vw, 21px); line-height: 1.5; min-height: 3em; }
#choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
#choices button { text-align: left; font-size: 16px; padding: 10px 14px; }
#choices button kbd { margin-right: 8px; color: var(--accent); }
#hint { text-align: right; font-size: 12px; color: var(--muted); margin-top: 8px; }

#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
#fade.on { opacity: 1; }

@media (max-width: 640px) {
  #objective { top: auto; bottom: 16px; }
  #stats { display: none; }
  #chapterTag span { font-size: 16px; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="chapterTag"></div>
  <div id="objective"></div>
  <div id="stats"></div>
  <div id="crosshair"></div>
  <div id="prompt" class="hidden"></div>
  <div id="lookHint" class="hidden"></div>
  <div id="toast"></div>
</div>

<div id="dialogue" class="hidden">
  <div id="speaker"></div>
  <div id="line"></div>
  <div id="choices"></div>
  <div id="hint"></div>
</div>

<div id="card" class="overlay hidden"></div>
<div id="pause" class="overlay hidden"></div>
<div id="menu" class="overlay"></div>
<div id="fade"></div>

ull of police."},objective:{sk:"N\xE1jdi Katku pri soche Hviezdoslava. Cestou sa porozpr\xE1vaj s \u013Eu\u010Fmi.",en:"Find Katka by the Hviezdoslav statue. Talk to people on the way."},spawn:[0,36],npcs:[{id:"anna",name:{sk:"Pani Anna",en:"Mrs Anna"},pos:[3.5,20],look:{coat:3880272,pants:2763306,hair:12105912,hat:"scarf",hatColor:7023162,candle:!0},voice:{g:"f",pitch:.95,rate:.88},start:"a1",after:"a_after",required:!0},{id:"vb",name:{sk:"Pr\xEDslu\u0161n\xEDk VB",en:"Police officer"},pos:[-10.5,26],look:{coat:4872766,pants:3819058,hat:"police",hatColor:4016691},voice:{g:"m",pitch:.75,rate:1.05},start:"p1",after:"p_after",required:!0},{id:"katka",name:{sk:"Katka",en:"Katka"},pos:[2.6,-7],look:{coat:9063210,pants:2829114,hair:5910552,hat:"beret",hatColor:1911370,candle:!0},voice:{g:"f",pitch:1.15,rate:1},start:"k1",wait:"k_wait",after:"k_after",final:!0}],nodes:{a1:{who:"anna",sk:"Synku, nem\xE1\u0161 svie\u010Dku? Na, vezmi si. Ni\u010D zl\xE9 nerob\xEDme \u2013 len tu stoj\xEDme a modl\xEDme sa.",en:"Son, haven't you got a candle? Here, take one. We're doing nothing wrong \u2013 we're just standing here and praying.",choices:[{sk:"Pre\u010Do ste sem pri\u0161li?",en:"Why did you come here?",next:"a2"},{sk:"Neboj\xEDte sa?",en:"Aren't you afraid?",next:"a3"}]},a2:{who:"anna",sk:"Chcem, aby m\xF4j vnuk mohol chodi\u0165 do kostola a nevyhodili ho za to zo \u0161koly. Chceme n\xE1bo\u017Eensk\xFA slobodu a ob\u010Dianske pr\xE1va. Ni\u010D viac.",en:"I want my grandson to be able to go to church without being thrown out of school for it. We want religious freedom and civil rights. Nothing more.",next:"a4"},a3:{who:"anna",sk:"Boj\xEDm sa. Ale strach som mala cel\xFD \u017Eivot. Dnes ho nech\xE1m st\xE1\u0165 tu na da\u017Edi.",en:"I am afraid. But I've been afraid my whole life. Tonight I'll leave my fear standing out here in the rain.",fx:{courage:1},next:"a4"},a4:{who:"anna",sk:"Tvoja priate\u013Eka je pri soche. Videla som ju. Cho\u010F, a dr\u017E svie\u010Dku tak, aby nezhasla.",en:"Your friend is by the statue. I saw her. Go \u2013 and hold the candle so it doesn't go out."},a_after:{who:"anna",sk:"Dr\u017E t\xFA svie\u010Dku, synku. Pokojne.",en:"Hold that candle, son. Calmly."},p1:{who:"vb",sk:"Ob\u010Dan! Toto zhroma\u017Edenie nie je povolen\xE9. Roz\xED\u010Fte sa!",en:"Citizen! This gathering is not permitted. Disperse!",choices:[{sk:"Stoj\xEDm tu len so svie\u010Dkou.",en:"I'm only standing here with a candle.",next:"p2",fx:{courage:1}},{sk:"U\u017E idem, s\xFAdruh.",en:"I'm going, comrade.",next:"p3"}]},p2:{who:"vb",sk:"So svie\u010Dkou\u2026 Vid\xEDte tie aut\xE1 s vodn\xFDmi delami? Ke\u010F pr\xEDdu rozkazy, nebudem sa nikoho ni\u010D p\xFDta\u0165. Cho\u010Fte domov, chlap\u010De.",en:"With a candle\u2026 See those water-cannon trucks? When the orders come, I won't be asking anyone anything. Go home, boy."},p3:{who:"vb",sk:"Rozumn\xFD chlapec. Zmiznite, k\xFDm sa to tu neza\u010Dne.",en:"Sensible boy. Disappear before things start here.",fx:{courage:-1}},p_after:{who:"vb",sk:"E\u0161te st\xE1le ste tu? Roz\xED\u010Fte sa!",en:"Still here? Move along!"},k_wait:{who:"katka",sk:"Jano! Kone\u010Dne. Po\u010Dkaj\u2026 najprv sa poobzeraj, porozpr\xE1vaj sa s \u013Eu\u010Fmi. Chcem, aby si videl, kto v\u0161etko pri\u0161iel.",en:"Jano! Finally. Wait\u2026 look around first, talk to people. I want you to see who came."},k1:{who:"katka",sk:"Jano, si tu! Myslela som, \u017Ee nepr\xEDde\u0161. Pozri sa okolo \u2013 tis\xEDce svie\u010Dok. Babky, \u0161tudenti, robotn\xEDci.",en:"Jano, you came! I thought you wouldn't. Look around \u2013 thousands of candles. Grandmothers, students, workers.",next:"k2"},k2:{who:"katka",sk:"\u013Dudia k\u013Ea\u010Dia v da\u017Edi a spievaj\xFA. A na kraji n\xE1mestia \u010Dakaj\xFA aut\xE1 s vodn\xFDmi delami.",en:"People are kneeling in the rain and singing. And at the edge of the square, the water-cannon trucks are waiting.",sfx:"hymn",choices:[{sk:"Zostanem s tebou.",en:"I'll stay with you.",next:"k3",fx:{courage:1,trust:1}},{sk:"Mali by sme \xEDs\u0165, Katka. Je to nebezpe\u010Dn\xE9.",en:"We should go, Katka. It's dangerous.",next:"k4"}]},k3:{who:"katka",sk:"\u010Eakujem. Raz si na tento ve\u010Der spomenieme ako na za\u010Diatok.",en:"Thank you. One day we'll remember tonight as the beginning.",next:"k5"},k4:{who:"katka",sk:"Mo\u017Eno m\xE1\u0161 pravdu. Ale niekto mus\xED st\xE1\u0165 prv\xFD. Dnes sme to my.",en:"Maybe you're right. But somebody has to stand first. Tonight it's us.",next:"k5"},k5:{who:"narrator",sk:"O pol jeden\xE1stej zapn\xFA vodn\xE9 del\xE1. \u013Dudia sa nerozbehn\xFA \u2013 k\u013Ea\u010Dia \u010Falej, k\xFDm ich policajti nerozo\u017Een\xFA.",en:"At half past ten the water cannons start. People do not run \u2013 they keep kneeling until the police drive them apart.",sfx:"water"},k_after:{who:"katka",sk:"Dr\u017E sa pri mne.",en:"Stay close to me."}},history:{sk:"25. marca 1988 sa na Hviezdoslavovom n\xE1mest\xED v Bratislave konalo pokojn\xE9 zhroma\u017Edenie za n\xE1bo\u017Eensk\xFA slobodu a dodr\u017Eiavanie \u013Eudsk\xFDch pr\xE1v. Inici\xE1torom bol exilov\xFD aktivista Mari\xE1n \u0160\u0165astn\xFD, doma ho podporila tajn\xE1 cirkev (napr. Franti\u0161ek Miklo\u0161ko, Vladim\xEDr Jukl, Silvester Kr\u010Dm\xE9ry). Pri\u0161lo nieko\u013Eko tis\xEDc \u013Eud\xED so svie\u010Dkami. Re\u017Eim nasadil Verejn\xFA bezpe\u010Dnos\u0165, vodn\xE9 del\xE1 a obu\u0161ky; desiatky \u013Eud\xED zadr\u017Eali. Svie\u010Dkov\xE1 manifest\xE1cia sa pova\u017Euje za jeden z najv\xFDznamnej\u0161\xEDch protestov proti komunistick\xE9mu re\u017Eimu pred Ne\u017Enou revol\xFAciou.",en:"On 25 March 1988, a peaceful gathering for religious freedom and human rights took place on Hviezdoslav Square in Bratislava. It was initiated by exiled activist Mari\xE1n \u0160\u0165astn\xFD and supported at home by the underground church (e.g. Franti\u0161ek Miklo\u0161ko, Vladim\xEDr Jukl, Silvester Kr\u010Dm\xE9ry). Several thousand people came with candles. The regime deployed the police, water cannons and batons; dozens were detained. The Candle Demonstration is considered one of the most important protests against the communist regime before the Velvet Revolution."}},{id:"students",scene:"students",date:{sk:"16. novembra 1989, popoludnie",en:"16 November 1989, afternoon"},place:{sk:"Pred univerzitou, Bratislava",en:"Outside the university, Bratislava"},title:{sk:"\u0160tudenti",en:"The Students"},intro:{sk:"Pre\u0161iel rok a pol. V Berl\xEDne padol m\xFAr, v Po\u013Esku a Ma\u010Farsku sa veci h\xFDbu. U n\xE1s je zatia\u013E ticho \u2013 a\u017E dnes. Bratislavsk\xED vysoko\u0161kol\xE1ci sa rozhodli vyjs\u0165 do ul\xEDc. De\u0148 pred Prahou.",en:"A year and a half has passed. The Berlin Wall has fallen; Poland and Hungary are on the move. Here it has been quiet \u2013 until today. Bratislava's university students have decided to march. One day before Prague."},objective:{sk:"Pridaj sa k \u0161tudentom. Pozor na mu\u017Eov v ko\u017Eenom kab\xE1te.",en:"Join the students. Watch out for men in leather coats."},spawn:[0,32],npcs:[{id:"peto",name:{sk:"Pe\u0165o",en:"Pe\u0165o"},pos:[5,8],look:{coat:3100527,pants:3815994,hair:1710618,hat:"none",scarf:11674146},voice:{g:"m",pitch:1.15,rate:1.08},start:"s1",after:"s_after",required:!0},{id:"kollar",name:{sk:"Mu\u017E v ko\u017Eenom kab\xE1te",en:"Man in a leather coat"},pos:[-14,18],look:{coat:1841688,pants:2500134,hair:2763306,hat:"fedora",hatColor:2236962},voice:{g:"m",pitch:.7,rate:.92},start:"e1",after:"e_after",required:!0},{id:"katka",name:{sk:"Katka",en:"Katka"},pos:[0,-6],look:{coat:9063210,pants:2829114,hair:5910552,hat:"beret",hatColor:1911370,scarf:15263976},voice:{g:"f",pitch:1.15,rate:1},start:"k1",wait:"k_wait",after:"k_after",final:!0}],nodes:{s1:{who:"peto",sk:"Jano! Ideme k ministerstvu \u0161kolstva. Chceme slobodn\xE9 \u0161t\xFAdium, slobodu prejavu a dial\xF3g. \u017Diadne previerky, \u017Eiadne vyhadzovanie zo \u0161koly za n\xE1zor.",en:"Jano! We're marching to the Ministry of Education. We want free study, freedom of speech and dialogue. No more vetting, no more expulsions for opinions.",choices:[{sk:"Nezavr\xFA n\xE1s?",en:"Won't they lock us up?",next:"s2"},{sk:"S \u010D\xEDm m\xF4\u017Eem pom\xF4c\u0165?",en:"How can I help?",next:"s3",fx:{trust:1}}]},s2:{who:"peto",sk:"Ke\u010F n\xE1s bude dos\u0165, nem\xF4\u017Eu zavrie\u0165 v\u0161etk\xFDch. A zajtra vyjd\xFA aj pra\u017Esk\xED \u0161tudenti.",en:"If there are enough of us, they can't lock us all up. And tomorrow the students in Prague are marching too."},s3:{who:"peto",sk:"Nes s nami transparent. A hovor pokojne \u2013 \u017Eiadne n\xE1silie. Pokoj je na\u0161a najv\xE4\u010D\u0161ia sila.",en:"Carry a banner with us. And keep calm \u2013 no violence. Calm is our greatest strength."},s_after:{who:"peto",sk:"Ideme u\u017E o chv\xED\u013Eu!",en:"We're moving in a minute!"},e1:{who:"kollar",sk:"J\xE1n Mr\xE1z, v\u0161ak? Prv\xFD ro\u010Dn\xEDk, filozofick\xE1 fakulta. Otec pracuje v chemickom z\xE1vode. Vid\xEDte, v\u0161etko o v\xE1s vieme.",en:"J\xE1n Mr\xE1z, isn't it? First year, Faculty of Arts. Your father works at the chemical plant. You see, we know everything about you.",next:"e2"},e2:{who:"kollar",sk:"Mohli by sme si navz\xE1jom pom\xF4c\u0165. Nap\xED\u0161ete n\xE1m, kto tieto\u2026 akcie organizuje. A \u0161t\xFAdium dokon\u010D\xEDte bez probl\xE9mov. Aj otec bude ma\u0165 pokoj.",en:"We could help each other. You'll write down who organises these\u2026 events. And you'll finish your studies without trouble. Your father will be left in peace too.",choices:[{sk:"Nie. Nebudem ud\xE1va\u0165 priate\u013Eov.",en:"No. I won't inform on my friends.",next:"e3",fx:{courage:2},flag:"refused"},{sk:"Mus\xEDm si to premyslie\u0165.",en:"I need to think about it.",next:"e4",flag:"hesitated"}]},e3:{who:"kollar",sk:"\u0160koda. Zapam\xE4t\xE1me si to, Mr\xE1z. My si pam\xE4t\xE1me v\u0161etko.",en:"Pity. We will remember this, Mr\xE1z. We remember everything."},e4:{who:"kollar",sk:"Prem\xFD\u0161\u013Eajte. Tu je moje \u010D\xEDslo. Ozvem sa s\xE1m.",en:"Think it over. Here's my number. I'll be in touch."},e_after:{who:"kollar",sk:"\u2026",en:"\u2026"},k_wait:{who:"katka",sk:"Jano, e\u0161te chv\xED\u013Eu. Porozpr\xE1vaj sa s Pe\u0165om, vie, kadia\u013E p\xF4jdeme.",en:"Jano, just a moment. Talk to Pe\u0165o, he knows the route."},k1:{who:"katka",sk:"Ten chlap v ko\u017Eenom kab\xE1te\u2026 rozpr\xE1val sa s tebou. \u010Co chcel?",en:"That man in the leather coat\u2026 he was talking to you. What did he want?",branch:i=>i.flags.refused?"k2a":"k2b"},k2a:{who:"player",sk:"Chcel, aby som ud\xE1val. Odmietol som ho.",en:"He wanted me to inform. I refused.",next:"k3a"},k3a:{who:"katka",sk:"Si odv\xE1\u017Enej\u0161\xED, ne\u017E si mysl\xED\u0161. Tak\xFDch \u013Eud\xED teraz potrebujeme.",en:"You're braver than you think. That's the kind of people we need now.",fx:{trust:1},next:"k5"},k2b:{who:"player",sk:"Chcel, aby som pre nich p\xEDsal. Povedal som, \u017Ee si to premysl\xEDm.",en:"He wanted me to write for them. I said I would think about it.",next:"k3b"},k3b:{who:"katka",sk:"Jano\u2026 nikdy im ni\u010D nepodpisuj. Nikdy. S\u013E\xFAb mi to.",en:"Jano\u2026 never sign anything for them. Never. Promise me.",choices:[{sk:"S\u013Eubujem.",en:"I promise.",next:"k4b",fx:{trust:1},flag:"promised"},{sk:"Ty nevie\u0161, ako mi vyhr\xE1\u017Eal.",en:"You don't know how he threatened me.",next:"k4c"}]},k4b:{who:"katka",sk:"Ver\xEDm ti.",en:"I believe you.",next:"k5"},k4c:{who:"katka",sk:"Viem. Vyhr\xE1\u017Eaj\xFA sa v\u0161etk\xFDm. Pr\xE1ve preto sme dnes tu.",en:"I know. They threaten everyone. That's exactly why we're here today.",next:"k5"},k5:{who:"katka",sk:"Po\u010Fme. P\xF4jdeme pokojne \u2013 s kvetmi, nie s kame\u0148mi.",en:"Let's go. We'll walk peacefully \u2013 with flowers, not stones.",sfx:"crowd"},k_after:{who:"katka",sk:"Dr\u017E sa pri mne.",en:"Stay close."}},history:{sk:"16. novembra 1989, de\u0148 pred udalos\u0165ami na pra\u017Eskej N\xE1rodnej triede, sa v Bratislave konal pokojn\xFD pochod vysoko\u0161kolsk\xFDch \u0161tudentov, ktor\xFD smeroval k budove Ministerstva \u0161kolstva. \u0160tudenti \u017Eiadali najm\xE4 slobodnej\u0161ie podmienky \u0161t\xFAdia a dial\xF3g. Na druh\xFD de\u0148, 17. novembra, zasiahla v Prahe pohotovostn\xE1 pol\xEDcia brut\xE1lne proti \u0161tudentsk\xE9mu sprievodu \u2013 to spustilo Ne\u017En\xFA revol\xFAciu. \u0160t\xE1tna bezpe\u010Dnos\u0165 (\u0160tB) mala rozsiahlu sie\u0165 spolupracovn\xEDkov a n\xE1tlak na ich z\xEDskavanie, aj medzi \u0161tudentmi, bol be\u017En\xFD.",en:"On 16 November 1989, the day before the events on N\xE1rodn\xED t\u0159\xEDda in Prague, university students in Bratislava held a peaceful march towards the Ministry of Education. They demanded mainly freer conditions of study and dialogue. The next day, 17 November, riot police in Prague brutally attacked a student procession \u2013 which triggered the Velvet Revolution. The State Security (\u0160tB) ran an extensive network of informers, and pressure to recruit them, including among students, was common."}},{id:"square",scene:"square",date:{sk:"Koniec novembra 1989, ve\u010Der",en:"Late November 1989, evening"},place:{sk:"N\xE1mestie SNP, Bratislava",en:"SNP Square, Bratislava"},title:{sk:"N\xE1mestie",en:"The Square"},intro:{sk:"Po 17. novembri sa v\u0161etko zmenilo. \u0160tudenti \u0161trajkuj\xFA, divadl\xE1 \u0161trajkuj\xFA. V Umeleckej besede vznikla Verejnos\u0165 proti n\xE1siliu. Ka\u017Ed\xFD ve\u010Der sa N\xE1mestie SNP zap\u013A\u0148a desa\u0165tis\xEDcami \u013Eud\xED. Sne\u017E\xED.",en:"After 17 November everything changed. Students are on strike, theatres are on strike. Public Against Violence was founded at the Umeleck\xE1 beseda. Every evening SNP Square fills with tens of thousands of people. It is snowing."},objective:{sk:"Prebij sa davom k trib\xFAne, kde \u010Dak\xE1 Katka.",en:"Make your way through the crowd to the stage where Katka is waiting."},spawn:[0,34],npcs:[{id:"igor",name:{sk:"Herec Igor",en:"Igor, actor"},pos:[-7,22],look:{coat:5974570,pants:2236962,hair:7035466,hat:"none",scarf:2056106},voice:{g:"m",pitch:.95,rate:.98},start:"i1",after:"i_after",required:!0},{id:"otec",name:{sk:"Otec",en:"Dad"},pos:[8,18],look:{coat:4604218,pants:2763306,hair:6974058,hat:"cap",hatColor:3487029},voice:{g:"m",pitch:.8,rate:.95},start:"o1",after:"o_after",required:!0},{id:"katka",name:{sk:"Katka",en:"Katka"},pos:[3,-24],look:{coat:9063210,pants:2829114,hair:5910552,hat:"beret",hatColor:1911370,scarf:15263976},voice:{g:"f",pitch:1.15,rate:1},start:"k1",wait:"k_wait",after:"k_after",final:!0}],nodes:{i1:{who:"igor",sk:"Divadl\xE1 \u0161trajkuj\xFA. Namiesto predstaven\xED diskutujeme s \u013Eu\u010Fmi. Toto je najv\xE4\u010D\u0161ie predstavenie m\xF4jho \u017Eivota \u2013 a nikto v \u0148om nehr\xE1.",en:"The theatres are on strike. Instead of performances we hold discussions with people. This is the greatest show of my life \u2013 and nobody is acting.",choices:[{sk:"\u010Co je Verejnos\u0165 proti n\xE1siliu?",en:"What is Public Against Violence?",next:"i2"},{sk:"Pre\u010Do \u013Eudia \u0161trngaj\xFA k\u013E\xFA\u010Dmi?",en:"Why are people jingling their keys?",next:"i3"}]},i2:{who:"igor",sk:"Vznikla pred p\xE1r d\u0148ami v Umeleckej besede. Herci, vedci, v\xFDtvarn\xEDci, \u0161tudenti. \u017Diadne zbrane, \u017Eiadna nen\xE1vis\u0165. Len verejnos\u0165.",en:"It was founded a few days ago at the Umeleck\xE1 beseda. Actors, scientists, artists, students. No weapons, no hatred. Just the public.",next:"i4"},i3:{who:"igor",sk:"To je zvon\u010Dek na rozl\xFA\u010Dku. S\xFAdruhovia, zazvonilo v\xE1m \u2013 m\xF4\u017Eete \xEDs\u0165 domov.",en:"It's the closing bell. Comrades, the bell has rung for you \u2013 you may go home.",sfx:"keys",next:"i4"},i4:{who:"igor",sk:"Katka je pri trib\xFAne. Cho\u010F, len cho\u010F \u2013 a nestr\xE1caj humor. Ten n\xE1m nem\xF4\u017Eu zak\xE1za\u0165.",en:"Katka is by the stage. Go on \u2013 and don't lose your sense of humour. That's one thing they can't ban."},i_after:{who:"igor",sk:"Trib\xFAna je rovno pred tebou!",en:"The stage is straight ahead!"},o1:{who:"otec",sk:"Jano. Neboj sa, nepri\u0161iel som \u0165a \u0165aha\u0165 domov.",en:"Jano. Don't worry, I didn't come to drag you home.",next:"o2"},o2:{who:"otec",sk:"V \u0161es\u0165desiatom \xF4smom som videl tanky pri univerzite. Odvtedy som dvadsa\u0165 rokov ml\u010Dal. U\u017E nem\xF4\u017Eem sedie\u0165 doma pri telev\xEDzore.",en:"In sixty-eight I saw tanks by the university. For twenty years after that I kept quiet. I can't sit at home in front of the TV any more.",choices:[{sk:"Som r\xE1d, \u017Ee si tu, oci.",en:"I'm glad you're here, Dad.",next:"o3",fx:{trust:1}},{sk:"Neboj\xED\u0161 sa o pr\xE1cu?",en:"Aren't you worried about your job?",next:"o4"}]},o3:{who:"otec",sk:"Mama ti posiela \u010Daj v termoske. A vraj si m\xE1\u0161 obliec\u0165 \u010Diapku.",en:"Mum sent you tea in a thermos. And she says you should put your hat on.",next:"o5"},o4:{who:"otec",sk:"Boj\xEDm sa. Ale v pondelok je gener\xE1lny \u0161trajk. Ak sa prid\xE1 cel\xFD z\xE1vod, nem\xF4\u017Eu vyhodi\u0165 v\u0161etk\xFDch.",en:"I am. But on Monday there's a general strike. If the whole plant joins, they can't fire everyone.",next:"o5"},o5:{who:"otec",sk:"Cho\u010F za Katkou. Ja tu postoj\xEDm s chlapmi z dielne.",en:"Go and find Katka. I'll stand here with the lads from the workshop."},o_after:{who:"otec",sk:"Daj na seba pozor, synak.",en:"Take care of yourself, son."},k_wait:{who:"katka",sk:"Jano! Videla som tvojho otca v dave \u2013 cho\u010F mu poveda\u0165 ahoj. A Igor \u0165a h\u013Eadal.",en:"Jano! I saw your dad in the crowd \u2013 go say hello. And Igor was looking for you."},k1:{who:"katka",sk:"Si tu! \u0160tudenti dostali na dve min\xFAty mikrof\xF3n. Chcem, aby si hovoril ty.",en:"You made it! The students have the microphone for two minutes. I want you to speak.",choices:[{sk:"Budem hovori\u0165 o strachu.",en:"I'll talk about fear.",next:"k2a",fx:{courage:1}},{sk:"Budem hovori\u0165 o slobode.",en:"I'll talk about freedom.",next:"k2b",fx:{courage:1}},{sk:"Nie, hovor ty, Katka. Ty to vie\u0161 lep\u0161ie.",en:"No, you speak, Katka. You do it better.",next:"k2c",fx:{trust:1}}]},k2a:{who:"player",sk:"Dlh\xE9 roky sme sa b\xE1li. B\xE1li sme sa na sch\xF4dzach, v \u0161kole, aj doma pri stole. Dnes ve\u010Der sme strach nechali doma!",en:"For years we were afraid. Afraid at meetings, at school, even at our own kitchen tables. Tonight we left our fear at home!",next:"k3"},k2b:{who:"player",sk:"Nechceme ni\u010D viac, ne\u017E \u010Do patr\xED ka\u017Ed\xE9mu \u010Dloveku: hovori\u0165 pravdu, cestova\u0165, voli\u0165. Slobodn\xE9 vo\u013Eby!",en:"We want nothing more than what belongs to every human being: to speak the truth, to travel, to vote. Free elections!",next:"k3"},k2c:{who:"katka",sk:"Dobre. Ale stoj pri mne. \u2013 Priatelia! Nie sme tu proti nikomu. Sme tu za nie\u010Do. Za slobodu a za pravdu!",en:"All right. But stand by me. \u2013 Friends! We are not here against anyone. We are here for something. For freedom and for truth!",next:"k3"},k3:{who:"narrator",sk:"N\xE1mest\xEDm sa nesie \u0161trngot desa\u0165tis\xEDcov k\u013E\xFA\u010Dov. Znie ako zvony.",en:"The jingling of tens of thousands of keys fills the square. It sounds like bells.",sfx:"keys",next:"k4"},k4:{who:"katka",sk:"Po\u010Duje\u0161 to, Jano? Toto u\u017E nikto nezastav\xED.",en:"Do you hear that, Jano? Nobody can stop this now."},k_after:{who:"katka",sk:"Bol si skvel\xFD.",en:"You were great."}},history:{sk:"19. novembra 1989 vznikla v bratislavskej Umeleckej besede Verejnos\u0165 proti n\xE1siliu (VPN) \u2013 slovensk\xFD n\xE1protivok pra\u017Esk\xE9ho Ob\u010Dianskeho f\xF3ra. Medzi jej zakladate\u013Emi boli umelci, vedci a aktivisti. Od 20. novembra sa na N\xE1mest\xED SNP konali ka\u017Edodenn\xE9 m\xEDtingy, na ktor\xE9 prich\xE1dzali desa\u0165tis\xEDce \u013Eud\xED. \u0160trngnutie k\u013E\xFA\u010Dmi sa stalo symbolom revol\xFAcie \u2013 \u201Ezvonen\xEDm\u201C \u013Eudia d\xE1vali najavo, \u017Ee komunistickej moci odzvonilo. \u0160tudenti a divadl\xE1 vst\xFApili do \u0161trajku.",en:"On 19 November 1989, Public Against Violence (VPN) was founded at the Umeleck\xE1 beseda in Bratislava \u2013 the Slovak counterpart of Prague's Civic Forum. Its founders included artists, scientists and activists. From 20 November onwards, daily rallies took place on SNP Square, attended by tens of thousands of people. Jingling keys became a symbol of the revolution \u2013 a \u201Cringing bell\u201D telling the communist rulers that their time was up. Students and theatres went on strike."}},{id:"strike",scene:"strike",date:{sk:"27. novembra 1989, 11:50",en:"27 November 1989, 11:50 am"},place:{sk:"Chemick\xFD z\xE1vod na okraji Bratislavy",en:"A chemical plant on the edge of Bratislava"},title:{sk:"Gener\xE1lny \u0161trajk",en:"The General Strike"},intro:{sk:"\u0160tudenti chodia po fabrik\xE1ch a vysvet\u013Euj\xFA, \u010Do sa stalo v Prahe. Dnes o dvan\xE1stej m\xE1 za\u010Da\u0165 dvojhodinov\xFD gener\xE1lny \u0161trajk. Re\u017Eim tvrd\xED, \u017Ee robotn\xEDci s\xFA na jeho strane. Pri\u0161iel som do z\xE1vodu, kde pracuje otec.",en:"Students are going from factory to factory explaining what happened in Prague. Today at noon a two-hour general strike is due to begin. The regime claims the workers are on its side. I have come to the plant where my father works."},objective:{sk:"Presved\u010D robotn\xEDkov. O dvan\xE1stej n\xE1jdi otca pri hale.",en:"Win over the workers. At noon, find your father by the hall."},spawn:[0,24],npcs:[{id:"ondrej",name:{sk:"Majster Ondrej",en:"Foreman Ondrej"},pos:[-9,4],look:{coat:2834275,pants:2834275,hair:5592405,hat:"cap",hatColor:2834275},voice:{g:"m",pitch:.72,rate:.95},start:"n1",after:"n_after",required:!0},{id:"zuzka",name:{sk:"Zuzka z dielne",en:"Zuzka from the workshop"},pos:[9,0],look:{coat:8030874,pants:3820122,hair:9067050,hat:"scarf",hatColor:12597547},voice:{g:"f",pitch:1.05,rate:1.05},start:"z1",after:"z_after",required:!0},{id:"otec",name:{sk:"Otec",en:"Dad"},pos:[0,-15],look:{coat:2834275,pants:2834275,hair:6974058,hat:"cap",hatColor:3487029},voice:{g:"m",pitch:.8,rate:.95},start:"o1",wait:"o_wait",after:"o_after",final:!0}],nodes:{n1:{who:"ondrej",sk:"\u010Eal\u0161\xED \u0161tudent\xEDk z mesta. Vy ste si to za\u010Dali a my m\xE1me pr\xEDs\u0165 o pr\xE1cu? M\xE1m tri deti.",en:"Another student from town. You started this, and now we're supposed to lose our jobs? I've got three kids.",choices:[{sk:"Nikto nechce, aby ste pri\u0161li o pr\xE1cu. Chceme, aby ste sa mohli slobodne rozhodova\u0165.",en:"Nobody wants you to lose your job. We want you to be free to decide for yourselves.",next:"n2",fx:{trust:1}},{sk:"Ak sa neprid\xE1te, zostane v\u0161etko po starom. Aj pre va\u0161e deti.",en:"If you don't join, everything stays the way it was. For your kids too.",next:"n3",fx:{courage:1}}]},n2:{who:"ondrej",sk:"Slobodne\u2026 To slovo som roky nahlas nepo\u010Dul. Dobre. O dvan\xE1stej vypnem linku. Ale len na dve hodiny!",en:"Freely\u2026 I haven't heard that word said out loud in years. All right. At noon I'll shut down the line. But only for two hours!",flag:"ondrej"},n3:{who:"ondrej",sk:"Po starom\u2026 aspo\u0148 viem, \u010Do ma \u010Dak\xE1. Ale moje deti\u2026 Hm. Uvid\xEDme, \u010Do urobia chlapi.",en:"The old way\u2026 at least I know what to expect. But my kids\u2026 Hm. We'll see what the lads do.",flag:"ondrej"},n_after:{who:"ondrej",sk:"E\u0161te desa\u0165 min\xFAt.",en:"Ten more minutes."},z1:{who:"zuzka",sk:"Ty si Michalov syn? Cel\xE1 na\u0161a zmena ide o dvan\xE1stej von! U\u0161ila som trikol\xF3ru z obrusov z jed\xE1lne.",en:"You're Michal's son? Our whole shift is walking out at noon! I sewed a tricolour out of the canteen tablecloths.",choices:[{sk:"Pre\u010Do \u0161trajkujete?",en:"Why are you striking?",next:"z2"},{sk:"Neboja sa ostatn\xED?",en:"Aren't the others afraid?",next:"z3"}]},z2:{who:"zuzka",sk:"Moja dc\xE9ra \u0161tuduje v Prahe. Sedemn\xE1steho bola na N\xE1rodnej. Mohli ju zbi\u0165. Dnes nebudem st\xE1\u0165 pri stroji.",en:"My daughter studies in Prague. On the seventeenth she was on N\xE1rodn\xED. They could have beaten her. Today I won't be standing at my machine.",fx:{trust:1}},z3:{who:"zuzka",sk:"Boja sa. Riadite\u013E r\xE1no hovoril, \u017Ee \u0161trajk je nez\xE1konn\xFD. Ale ke\u010F p\xF4jdeme v\u0161etci, nebude ma\u0165 koho potresta\u0165.",en:"They are. This morning the director said the strike is illegal. But if we all go, there'll be nobody left to punish."},z_after:{who:"zuzka",sk:"O dvan\xE1stej, nezabudni!",en:"Noon, don't forget!"},o_wait:{who:"otec",sk:"Jano, \u010Do tu rob\xED\u0161? Chlapi e\u0161te v\xE1haj\xFA. Porozpr\xE1vaj sa s Ondrejom \u2013 jeho bud\xFA po\u010D\xFAva\u0165.",en:"Jano, what are you doing here? The lads are still hesitating. Talk to Ondrej \u2013 they'll listen to him."},o1:{who:"otec",sk:"Je dvan\xE1s\u0165. Po\u010Duje\u0161 to?",en:"It's noon. Do you hear that?",sfx:"siren",next:"o2"},o2:{who:"narrator",sk:"Sir\xE9ny zav\xFDjaj\xFA v celej krajine. Linky sa zastavuj\xFA. Z h\xE1l vych\xE1dzaj\xFA \u013Eudia \u2013 v mont\xE9rkach, so z\xE1stavami, s trikol\xF3rami.",en:"Sirens wail across the whole country. Production lines stop. People pour out of the halls \u2013 in overalls, with flags and tricolours.",branch:i=>i.stats.trust>=3?"o3a":"o3b"},o3a:{who:"otec",sk:"Aj Ondrej vy\u0161iel. Pozri \u2013 cel\xE1 zmena. Si dobr\xFD chlapec, Jano. Mama bude hrd\xE1.",en:"Even Ondrej came out. Look \u2013 the whole shift. You're a good lad, Jano. Your mum will be proud.",next:"o4"},o3b:{who:"otec",sk:"Nie v\u0161etci vy\u0161li. Niektor\xED sa e\u0161te boja. Ale je n\xE1s viac, ne\u017E som \u010Dakal.",en:"Not everyone came out. Some are still scared. But there are more of us than I expected.",next:"o4"},o4:{who:"otec",sk:"Dvadsa\u0165 rokov som ml\u010Dal. Dnes ml\u010D\xED fabrika \u2013 a to je najhlasnej\u0161ie, \u010Do som kedy po\u010Dul.",en:"I kept quiet for twenty years. Today the factory is silent \u2013 and it's the loudest thing I've ever heard."},o_after:{who:"otec",sk:"Dve hodiny. Potom ideme sp\xE4\u0165 k strojom \u2013 ale u\u017E ako slobodn\xED \u013Eudia.",en:"Two hours. Then back to the machines \u2013 but as free people."}},history:{sk:"27. novembra 1989 od 12:00 do 14:00 prebehol v celom \u010Ceskoslovensku gener\xE1lny \u0161trajk. Zapojila sa pod\u013Ea odhadov v\xE4\u010D\u0161ina obyvate\u013Eov \u2013 tov\xE1rne, \xFArady, \u0161koly aj obchody. \u0160trajk uk\xE1zal, \u017Ee revol\xFAciu nepodporuj\xFA len \u0161tudenti a umelci, ale aj robotn\xEDci, na ktor\xFDch sa re\u017Eim odvol\xE1val. O dva dni nesk\xF4r, 29. novembra, Feder\xE1lne zhroma\u017Edenie vypustilo z \xFAstavy \u010Dl\xE1nok o ved\xFAcej \xFAlohe Komunistickej strany.",en:"On 27 November 1989, from 12:00 to 14:00, a general strike took place across Czechoslovakia. By most estimates, a majority of the population took part \u2013 factories, offices, schools and shops. The strike showed that the revolution was backed not only by students and artists but also by the workers the regime claimed to represent. Two days later, on 29 November, the Federal Assembly removed the article on the leading role of the Communist Party from the constitution."}},{id:"border",scene:"border",date:{sk:"10. decembra 1989",en:"10 December 1989"},place:{sk:"Hranica Petr\u017Ealka \u2013 Berg, smer Hainburg",en:"Petr\u017Ealka \u2013 Berg border, towards Hainburg"},title:{sk:"Ahoj, Eur\xF3pa",en:"Hello, Europe"},intro:{sk:"\u0160tyridsa\u0165 rokov delil Petr\u017Ealku od Rak\xFAska ostnat\xFD dr\xF4t. Dnes je nede\u013Ea a desa\u0165tis\xEDce Bratislav\u010Danov sa vybrali pe\u0161o do rak\xFAskeho Hainburgu. Bez povolenia na vycestovanie. Len tak \u2013 na prech\xE1dzku.",en:"For forty years barbed wire separated Petr\u017Ealka from Austria. Today is Sunday, and tens of thousands of people from Bratislava are walking to Hainburg in Austria. Without exit permits. Just like that \u2013 for a stroll."},objective:{sk:"Prejdi hranicou. Katka \u010Dak\xE1 na rak\xFAskej strane.",en:"Cross the border. Katka is waiting on the Austrian side."},spawn:[0,44],npcs:[{id:"guard",name:{sk:"Pohrani\u010Dn\xEDk",en:"Border guard"},pos:[7.5,3.5],look:{coat:5200698,pants:5200698,hair:3815994,hat:"ushanka",hatColor:5200698},voice:{g:"m",pitch:.82,rate:.92},start:"g1",after:"g_after",required:!0},{id:"gerti",name:{sk:"Gerti z Hainburgu",en:"Gerti from Hainburg"},pos:[-7,-13.5],look:{coat:3042106,pants:3355443,hair:14205066,hat:"none",scarf:14211288},voice:{g:"f",pitch:1,rate:1},start:"r1",after:"r_after",required:!0},{id:"katka",name:{sk:"Katka",en:"Katka"},pos:[5.5,-28],look:{coat:9063210,pants:2829114,hair:5910552,hat:"beret",hatColor:1911370,scarf:15263976},voice:{g:"f",pitch:1.15,rate:1},start:"k1",wait:"k_wait",after:"k_after",final:!0}],nodes:{g1:{who:"guard",sk:"Dvadsa\u0165 rokov som str\xE1\u017Eil tento dr\xF4t. Mali sme rozkaz zastavi\u0165 ka\u017Ed\xE9ho, kto by chcel prejs\u0165. Za ka\u017Ed\xFA cenu.",en:"For twenty years I guarded this wire. Our orders were to stop anyone who tried to cross. At any cost.",choices:[{sk:"\u013Dutujete nie\u010Do?",en:"Do you regret anything?",next:"g2"},{sk:"A dnes?",en:"And today?",next:"g3"}]},g2:{who:"guard",sk:"Ka\u017Ed\xFD de\u0148. Pri tomto dr\xF4te zomierali \u013Eudia. Cho\u010F, chlap\u010De. Svet je tam \u2013 a je aj tvoj.",en:"Every day. People died at this wire. Go on, lad. The world is over there \u2013 and it's yours too."},g3:{who:"guard",sk:"Dnes len stoj\xEDm a pozer\xE1m sa. Prv\xFDkr\xE1t v \u017Eivote ma nikto nen\xFAti ani strie\u013Ea\u0165, ani ml\u010Da\u0165.",en:"Today I just stand and watch. For the first time in my life nobody is making me shoot or keep quiet."},g_after:{who:"guard",sk:"Pokojn\xFA cestu.",en:"Safe journey."},r1:{who:"gerti",sk:"Gr\xFC\xDF Gott! Vitajte, susedia! Cel\xFD Hainburg \u010Dak\xE1 s tepl\xFDm \u010Dajom. To\u013Eko rokov sme sa na v\xE1s len pozerali cez rieku.",en:"Gr\xFC\xDF Gott! Welcome, neighbours! All of Hainburg is waiting with hot tea. For so many years we could only look at you across the river.",choices:[{sk:"\u010Eakujeme. Je to ako sen.",en:"Thank you. It's like a dream.",next:"r2",fx:{trust:1}},{sk:"Ako vyzer\xE1 Viede\u0148?",en:"What is Vienna like?",next:"r3"}]},r2:{who:"gerti",sk:"Nie je to sen. Sme len p\xE1r kilometrov od seba. V\u017Edy sme boli.",en:"It's not a dream. We're only a few kilometres apart. We always were."},r3:{who:"gerti",sk:"Pr\xED\u010Fte sa pozrie\u0165 sami. U\u017E v\xE1s nikto nezastav\xED. Viede\u0148 je hodinu odtia\u013Eto!",en:"Come and see for yourselves. Nobody will stop you now. Vienna is an hour from here!"},r_after:{who:"gerti",sk:"Willkommen! Vitajte!",en:"Willkommen! Welcome!"},k_wait:{who:"katka",sk:"Jano! Po\u010F sem! Ale najprv sa pozdrav s \u013Eu\u010Fmi \u2013 dnes sa zdrav\xEDme so v\u0161etk\xFDmi.",en:"Jano! Over here! But say hello to people first \u2013 today we greet everyone."},k1:{who:"katka",sk:"Pam\xE4t\xE1\u0161 na svie\u010Dky na Hviezdoslavovom? Vtedy n\xE1s bolo p\xE1r tis\xEDc a polievali n\xE1s vodou. Dnes kr\xE1\u010Da cel\xE9 mesto.",en:"Remember the candles on Hviezdoslav Square? There were a few thousand of us and they hosed us down. Today the whole city is walking.",branch:i=>i.flags.hesitated&&!i.flags.promised?"k2h":"k2"},k2h:{who:"katka",sk:"A ten mu\u017E v ko\u017Eenom kab\xE1te\u2026 zavolal ti e\u0161te?",en:"And that man in the leather coat\u2026 did he ever call you?",next:"k2h2"},k2h2:{who:"player",sk:"Nie. U\u017E nezavol\xE1 nikomu.",en:"No. He won't be calling anyone any more.",next:"k2"},k2:{who:"katka",sk:"\u010Co bude\u0161 robi\u0165, ke\u010F bude v\u0161etko slobodn\xE9? Naozaj v\u0161etko?",en:"What will you
