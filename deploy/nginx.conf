server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  gzip_vary on;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # hra je jeden veľký HTML súbor – posiela sa komprimovaná, prehliadač si ju overuje (ETag)
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }
  location ~* \.(mp3|jpg|png|svg|webp)$ {
    expires 30d;
    add_header Cache-Control "public" always;
  }
  error_page 404 /404.html;
}
