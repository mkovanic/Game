<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sviečky a kľúče</title>
<meta name="description" content="3D príbehová hra z Nežnej revolúcie na Slovensku 1988–1989 · A 3D story game about the Velvet Revolution in Slovakia." />
<style>/*CSS*/</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="chapterTag"></div>
  <div id="objective"></div>
  <div id="stats"></div>
  <div id="crosshair"></div>
  <div id="prompt" class="hidden"></div>
  <div id="lookHint" class="hidden"></div>
  <div id="toast"></div>
  <div id="action" class="hidden"></div>
  <div id="flash"></div>
</div>

<div id="dialogue" class="hidden">
  <div id="speaker"></div>
  <div id="line"></div>
  <div id="choices"></div>
  <div id="hint"></div>
</div>

<div id="card" class="overlay hidden"></div>
<div id="pause" class="overlay hidden"></div>
<div id="menu" class="overlay"></div>
<div id="fade"></div>

<script>/*JS*/</script>
</body>
</html>
